package:
  description: Cockpit link for quick access to arkitekt
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: Apache-2.0
  sources:
    - https://github.com/openUC2/pallet

deployment:
  provides:
    file-exports:
      - description: Cockpit tool manifest for arkitekt
        target: overlays/usr/share/cockpit/arkitekt/manifest.json
      - description: Cockpit tool page for arkitekt
        target: overlays/usr/share/cockpit/arkitekt/index.html
